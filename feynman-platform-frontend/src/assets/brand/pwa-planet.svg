<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="planetBase" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#C8F5E6" />
      <stop offset="0.55" stop-color="#8FD9C2" />
      <stop offset="1" stop-color="#5FB79F" />
    </radialGradient>
    <radialGradient id="planetShade" cx="0.36" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="1" stop-color="#1F5A50" stop-opacity="0.3" />
    </radialGradient>
    <radialGradient id="specular" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6" />
      <stop offset="0.5" stop-color="#FFEFD2" />
      <stop offset="1" stop-color="#F6DDB6" />
    </linearGradient>
    <linearGradient id="rocketBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FCEEDC" />
    </linearGradient>
    <clipPath id="planetClip">
      <circle cx="512" cy="500" r="250" />
    </clipPath>
    <clipPath id="ringTop">
      <rect x="0" y="0" width="1024" height="520" />
    </clipPath>
    <clipPath id="ringBottom">
      <rect x="0" y="520" width="1024" height="504" />
    </clipPath>
  </defs>

  <!-- 光环后半圈（被星球挡住） -->
  <g transform="rotate(-14 512 520)" clip-path="url(#ringTop)">
    <ellipse cx="512" cy="520" rx="392" ry="126" fill="none" stroke="url(#ringGrad)" stroke-width="46" />
  </g>

  <!-- 星球本体 -->
  <circle cx="512" cy="500" r="250" fill="url(#planetBase)" />
  <g clip-path="url(#planetClip)">
    <path d="M280 330 C340 278 472 274 542 320 C602 358 586 420 520 446 C450 472 330 460 292 404 C268 372 262 350 280 330 Z" fill="#C9BAF4" />
    <path d="M362 330 C410 306 480 312 506 344 C522 372 480 392 430 390 C380 388 342 356 362 330 Z" fill="#E4F8F0" opacity="0.9" />
    <path d="M596 522 C656 490 742 510 762 560 C778 602 720 642 650 632 C590 624 562 556 596 522 Z" fill="#C9BAF4" />
    <path d="M392 592 C442 570 500 584 512 616 C524 650 470 674 420 662 C380 652 366 610 392 592 Z" fill="#C9BAF4" opacity="0.85" />
    <circle cx="604" cy="392" r="34" fill="#E4F8F0" opacity="0.85" />
    <circle cx="330" cy="498" r="22" fill="#E4F8F0" opacity="0.8" />
  </g>
  <circle cx="512" cy="500" r="250" fill="url(#planetShade)" />
  <ellipse cx="428" cy="372" rx="126" ry="82" fill="url(#specular)" transform="rotate(-20 428 372)" />

  <!-- 光环前半圈（压在星球之上） -->
  <g transform="rotate(-14 512 520)" clip-path="url(#ringBottom)">
    <ellipse cx="512" cy="520" rx="392" ry="126" fill="none" stroke="url(#ringGrad)" stroke-width="46" />
    <ellipse cx="512" cy="520" rx="392" ry="126" fill="none" stroke="#E7C79B" stroke-width="3" opacity="0.55" />
  </g>

  <!-- 小火箭 -->
  <g transform="translate(806 616) rotate(-14)">
    <path d="M-62 -30 L-104 -52 L-62 -4 Z" fill="#FFB3A8" />
    <path d="M-62 30 L-104 52 L-62 4 Z" fill="#FFB3A8" />
    <path d="M-118 0 C-150 -12 -150 12 -118 0 Z" fill="#FFD166" />
    <rect x="-64" y="-30" width="98" height="60" rx="30" fill="url(#rocketBody)" stroke="#F0DCC4" stroke-width="2" />
    <path d="M28 -28 C58 -18 76 -8 84 0 C76 8 58 18 28 28 Z" fill="#FF8A80" />
    <circle cx="0" cy="0" r="17" fill="#7FD1B9" />
    <circle cx="0" cy="0" r="17" fill="none" stroke="#FFFFFF" stroke-width="6" />
    <circle cx="-5" cy="-5" r="5" fill="#FFFFFF" opacity="0.7" />
    <rect x="-52" y="-21" width="60" height="9" rx="4.5" fill="#FFFFFF" opacity="0.75" />
  </g>
</svg>
